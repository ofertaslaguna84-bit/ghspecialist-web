name: Sincronizar clave del panel (blog)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - js/gh-site-config.js

permissions:
  contents: read
  secrets: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar libsodium-wrappers
        run: npm install --no-save libsodium-wrappers

      - name: Sincronizar secrets (GitHub + Vercel)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_PAT || secrets.SETUP_GITHUB_TOKEN || secrets.GHSPECIALIST_GITHUB_TOKEN || github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: node scripts/set-blog-panel-secret.mjs
