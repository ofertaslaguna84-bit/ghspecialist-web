name: Blog SEO local — 4 ciudades (Torreón, MTY, CDMX, GDL)

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Ciudad (vacío = las 4)'
        required: false
        type: choice
        options:
          - ''
          - torreon
          - monterrey
          - cdmx
          - guadalajara
  schedule:
    # OJO con este cron: si se ponen a la vez el dia del mes (1-7) y el dia de
    # la semana (1=lunes), cron dispara cuando coincide CUALQUIERA de los dos,
    # no los dos juntos. '0 10 1-7 * 1' no era "primer lunes": corria los dias
    # 1 al 7 Y ademas todos los lunes -- 8 veces en agosto 2026, y cada corrida
    # generaba un duplicado de los 4 articulos de ciudad.
    # Se deja solo el rango de dias y el filtro de lunes va en el job.
    - cron: '0 10 1-7 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # El cron dispara los dias 1 al 7; aqui se deja pasar solo el que cae en
  # lunes, que es el primer lunes del mes. Lanzado a mano (workflow_dispatch)
  # siempre pasa.
  guard:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.chk.outputs.seguir }}
    steps:
      - id: chk
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lanzado a mano, se continua."
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "1" ]; then
            echo "Hoy es lunes y estamos en los primeros 7 dias: primer lunes del mes."
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          else
            echo "Hoy es $(date -u +%A), no es el primer lunes. No se genera nada."
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: guard
    if: needs.guard.outputs.seguir == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar artículos SEO por ciudad
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_GEMINI_IMAGES: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_GENERATE_SECRET: ${{ secrets.BLOG_GENERATE_SECRET }}
          CLIENT_SECRET: ${{ secrets.BLOG_GENERATE_SECRET }}
          BLOG_CITY: ${{ github.event.inputs.city }}
          BLOG_BATCH_DELAY_MS: '12000'
        run: node scripts/blog-generate-cities-batch.mjs

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml blog/feed.xml blog-generate-result.json torreon/ llms.txt f7e2a9b1c4d6e8f1029384756acdef0123.txt robots.txt servicios/ index.html js/gh-blog-topic.js 2>/dev/null || true
          git diff --staged --quiet && echo "Sin cambios en git" || (git commit -m "blog: lote SEO local ciudades ($(date -u +%Y-%m-%d))" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
