name: Indexar sitio (IndexNow)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'blog/**'
      - 'scripts/indexnow.mjs'

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Notificar buscadores (IndexNow + sitemap)
        run: node scripts/indexnow.mjs --sitemap
