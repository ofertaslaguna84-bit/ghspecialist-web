name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate sitemap and RSS feed
        run: |
          node scripts/generate-us-retired-pages.mjs
          node scripts/generate-seo.mjs
      - name: Quitar archivos internos de lo publicado
        run: |
          rm -rf scripts docs-wix .claude node_modules
          rm -f package.json package-lock.json .gitignore convert_to_pdf.py *.pptx
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
